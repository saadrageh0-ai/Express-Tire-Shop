<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log in - Express Tire Shop</title>

        <!-- The styles live here (not in style.css), because style.css is
             behind the login guard and can't load before you log in. -->
        <style>
            :root {
                --dark: #1f2329;
                --accent: #f28c28;
                --light: #f5f6f8;
                --border: #dde1e6;
                --muted: #6b7280;
                --danger: #c0392b;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                font-family: system-ui, sans-serif;
                color: var(--dark);
                background: var(--light);
            }

            .card {
                width: 100%;
                max-width: 380px;
                padding: 32px 28px;
                background: white;
                border-radius: 16px;
                border-top: 5px solid var(--accent);
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                text-align: center;
                animation: fadeIn 0.4s ease;
            }

            .logo {
                width: 64px;
                height: 64px;
                margin: 0 auto 12px;
                display: grid;
                place-items: center;
                border-radius: 50%;
                background: var(--accent);
                font-size: 32px;
                box-shadow: 0 4px 12px rgba(242, 140, 40, 0.4);
            }

            h1 {
                margin: 0;
                font-size: 1.7rem;
                color: var(--accent);
            }

            .subtitle {
                margin: 6px 0 24px;
                color: var(--muted);
            }

            form {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            input {
                width: 100%;
                padding: 12px 14px;
                border: 2px solid var(--border);
                border-radius: 10px;
                font: inherit;
                font-size: 1rem;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(242, 140, 40, 0.25);
            }

            button {
                margin-top: 6px;
                padding: 13px;
                border: none;
                border-radius: 10px;
                background: var(--accent);
                color: white;
                font: inherit;
                font-size: 1.1rem;
                font-weight: 600;
                cursor: pointer;
                transition: background-color 0.2s ease, transform 0.2s ease;
            }

            button:hover {
                background: var(--dark);
                transform: translateY(-2px);
            }

            .error {
                margin: 16px 0 0;
                padding: 10px 12px;
                border-radius: 10px;
                background: #fdecea;
                color: var(--danger);
                font-weight: 600;
                animation: shake 0.4s ease;
            }

            .error[hidden] {
                display: none;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25%      { transform: translateX(-6px); }
                75%      { transform: translateX(6px); }
            }
        </style>
    </head>

    <body>
        <main class="card">
            <div class="logo">🛞</div>
            <h1>Express Tire Shop</h1>
            <p class="subtitle">Please log in to continue</p>

            <form method="POST" action="/login">
                <input type="text" name="username" placeholder="Username" autocomplete="username" required autofocus>
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Log in</button>
            </form>

            <p id="error" class="error" hidden>❌ Wrong username or password</p>
        </main>

        <script>
            if (location.search.includes("error=1")) {
                document.getElementById("error").hidden = false;
            }
        </script>
    </body>
</html>
