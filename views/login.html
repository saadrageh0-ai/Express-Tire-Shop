<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log in - Express Tire Shop</title>

        <!-- The styles live here (not in style.css), because style.css is
             behind the login guard and can't load before you log in.
             Colors match the dark theme in public/style.css. -->
        <style>
            :root {
                color-scheme: dark;

                --bg: #0f1115;
                --panel: #181b21;
                --panel-2: #20242c;
                --border: #2c313a;
                --text: #e8eaed;
                --muted: #9aa0a8;
                --accent: #ffb020;
                --accent-text: #111;
                --danger: #ff5c5c;
            }

            * {
                box-sizing: border-box;
            }

            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 16px;
                font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
                font-size: 16px;
                color: var(--text);
                background: var(--bg);
            }

            .card {
                width: 100%;
                max-width: 380px;
                padding: 32px 24px;
                background: var(--panel);
                border: 1px solid var(--border);
                border-radius: 16px;
                text-align: center;
                animation: fadeIn 0.4s ease;
            }

            .logo {
                width: 64px;
                height: 64px;
                margin: 0 auto 14px;
                display: grid;
                place-items: center;
                border-radius: 50%;
                background: var(--accent);
                font-size: 32px;
            }

            h1 {
                margin: 0;
                font-size: 1.5rem;
                font-weight: 800;
                color: var(--text);
            }

            .subtitle {
                margin: 6px 0 24px;
                color: var(--muted);
            }

            form {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            /* font-size 16px stops iPhones from zooming in */
            input {
                width: 100%;
                min-height: 48px;
                padding: 0 14px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--panel-2);
                color: var(--text);
                font: inherit;
                font-size: 16px;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            input::placeholder {
                color: var(--muted);
            }

            input:focus {
                outline: none;
                border-color: var(--accent);
                box-shadow: 0 0 0 3px rgba(255, 176, 32, 0.25);
            }

            button {
                margin-top: 6px;
                min-height: 48px;
                border: none;
                border-radius: 10px;
                background: var(--accent);
                color: var(--accent-text);
                font: inherit;
                font-size: 1.05rem;
                font-weight: 700;
                cursor: pointer;
            }

            button:active {
                transform: scale(0.98);
                filter: brightness(0.9);
            }

            @media (hover: hover) {
                button:hover {
                    filter: brightness(1.1);
                }
            }

            .error {
                margin: 16px 0 0;
                padding: 10px 12px;
                border-radius: 10px;
                background: rgba(255, 92, 92, 0.12);
                color: var(--danger);
                font-weight: 600;
                animation: shake 0.4s ease;
            }

            .error[hidden] {
                display: none;
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to   { opacity: 1; transform: translateY(0); }
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25%      { transform: translateX(-6px); }
                75%      { transform: translateX(6px); }
            }
        </style>
    </head>

    <body>
        <main class="card">
            <div class="logo">🛞</div>
            <h1>Express Tire Shop</h1>
            <p class="subtitle">Please log in to continue</p>

            <form method="POST" action="/login">
                <input type="text" name="username" placeholder="Username" autocomplete="username" required autofocus>
                <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Log in</button>
            </form>

            <p id="error" class="error" hidden>❌ Wrong username or password</p>
        </main>

        <script>
            if (location.search.includes("error=1")) {
                document.getElementById("error").hidden = false;
            }
        </script>
    </body>
</html>
